<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Escritorio 98</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  /* Layout: pantalla virtual a pantalla completa (se mueve con el cursor); íconos grandes arriba a la izquierda, ventanas flotantes, barra de tareas fija abajo. */
  --desk:#008080; --label:#fff; --lblsh:1px 1px 2px rgba(0,0,0,.75);
  --face:#c0c0c0; --face-lt:#dfdfdf; --white:#fff; --shade:#808080; --ink:#000;
  --navy:#000080; --sky:#1084d0; --off-a:#808080; --off-b:#b5b5b5;
  --paper:#fff; --amber:#ffa31a; --lcd:#140c00; --num:#0000c8; --op:#c00000;
  --ui:Tahoma,"MS Sans Serif","Microsoft Sans Serif",Geneva,Verdana,sans-serif;
  --px:"VT323","Courier New",monospace;
  --aero:"Nunito Sans","Segoe UI",Frutiger,"Trebuchet MS",sans-serif;
  --task-h:30px; --icon:64px;
  --bevel-out:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;
  --bevel-press:inset -1px -1px #fff,inset 1px 1px #000,inset -2px -2px #dfdfdf,inset 2px 2px #808080;
  --bevel-field:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000;
  --bevel-soft:inset 1px 1px #808080,inset -1px -1px #fff;
  --bevel-flat:inset -1px -1px #808080,inset 1px 1px #fff;
  --dither:conic-gradient(#fff 25%,#c0c0c0 0 50%,#fff 0 75%,#c0c0c0 0);
}
html{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:#06121c;color:var(--ink);font:12px/1.2 var(--ui);-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:#000;margin:0}
svg.ico{display:block;flex:none;shape-rendering:crispEdges}
@media (max-width:520px){:root{--icon:48px}}

#os{position:relative;height:100%;overflow:hidden;transform-origin:50% 50%;will-change:transform}
#desk{position:absolute;inset:0 0 var(--task-h) 0;overflow:hidden;z-index:1;background-color:var(--desk);background-size:cover;background-position:center bottom;background-repeat:no-repeat}

/* Íconos del escritorio */
.icons{position:absolute;top:12px;bottom:12px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:12px 10px}
.dicon{width:calc(var(--icon) + 44px);display:flex;flex-direction:column;align-items:center;padding:4px 2px;outline:0;animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
.dicon .glyph{position:relative;display:block;width:var(--icon);height:var(--icon);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.dicon .glyph svg{display:block;width:100%;height:100%;transition:filter .2s}
.dicon .glyph::after{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:6px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.45),transparent 70%);opacity:0;transform:scale(.6);transition:opacity .2s,transform .22s}
.dicon:hover .glyph,.dicon:focus-visible .glyph{transform:translateY(-5px) scale(1.12)}
.dicon:hover .glyph svg,.dicon:focus-visible .glyph svg{filter:drop-shadow(0 0 7px rgba(255,255,255,.95))}
.dicon:hover .glyph::after,.dicon:focus-visible .glyph::after{opacity:1;transform:scale(1)}
.dicon:active .glyph{transform:translateY(0) scale(.96)}
.dicon .lbl{display:block;max-width:100%;margin-top:8px;padding:1px 4px;color:var(--label);text-shadow:var(--lblsh);font-size:13px;text-align:center;overflow-wrap:anywhere;line-height:1.15;transition:background-color .2s}
.dicon:hover .lbl{background:rgba(255,255,255,.2)}
.dicon.sel .glyph svg{filter:sepia(1) hue-rotate(190deg) saturate(2.5) brightness(.75)}
.dicon.sel .lbl{background:var(--navy);color:#fff;text-shadow:none}
.dicon:focus-visible .lbl{outline:1px dotted #ff0;outline-offset:-1px}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(10px)}to{opacity:1;transform:none}}

/* Ventanas */
.win{position:absolute;display:flex;flex-direction:column;box-sizing:border-box;background:var(--face);box-shadow:var(--bevel-out),3px 4px 10px rgba(0,0,0,.35);padding:3px;color:#000}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
.win.tr{transition:left .24s cubic-bezier(.3,.8,.3,1),top .24s cubic-bezier(.3,.8,.3,1),width .24s cubic-bezier(.3,.8,.3,1),height .24s cubic-bezier(.3,.8,.3,1)}
.tb{display:flex;align-items:center;gap:4px;flex:none;height:20px;padding:0 2px 0 3px;box-sizing:border-box;background:linear-gradient(90deg,var(--off-a),var(--off-b));color:var(--face-lt);touch-action:none}
.win.active .tb{background:linear-gradient(90deg,var(--navy),var(--sky));color:#fff}
.tb .t{flex:1;min-width:0;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;flex:none}
.tbtn{display:grid;place-items:center;width:16px;height:14px;padding:0;border:0;background:var(--face);box-shadow:var(--bevel-out);transition:filter .15s}
.tbtn:hover{filter:brightness(1.12)}
.tbtn:active{box-shadow:var(--bevel-press)}
.tbtn.close{margin-left:2px}
.tbtn .g{fill:#000;shape-rendering:crispEdges}
.tbtn .g .cover{fill:var(--face)}
.win:not(.max) .g-rest{display:none}
.win.max .g-max{display:none}
.client{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:3px}
.client.scroll{overflow:auto}

/* Controles clásicos */
.btn{display:inline-grid;place-items:center;min-width:75px;height:23px;padding:0 12px;border:0;background:var(--face);box-shadow:var(--bevel-out);white-space:nowrap}
.btn:active{box-shadow:var(--bevel-press);padding-top:1px}
.btn.def{outline:1px solid #000}
.btn:focus-visible,.task:focus-visible,.sbtn:focus-visible,.tbtn:focus-visible,.tab:focus-visible,.mi:focus-visible,.tray-btn:focus-visible,.wpt:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.tbtn:focus-visible{outline-offset:-3px}
.btnrow{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;padding:10px 4px 4px}
.sep{flex:none;width:2px;height:22px;box-shadow:inset 1px 0 #808080,inset -1px 0 #fff}

/* Barra de menús de las ventanas y desplegables */
.menubar{display:flex;flex:none;padding:1px 0 2px;margin-bottom:3px;box-shadow:0 1px 0 #808080,0 2px 0 #fff}
.mi{padding:2px 7px 3px;border:0;background:transparent}
.mi:hover{box-shadow:var(--bevel-flat)}
.mi.open{background:var(--navy);color:#fff;box-shadow:none}
.dd{position:absolute;z-index:30;display:flex;flex-direction:column;min-width:180px;padding:3px 2px;background:var(--face);box-shadow:var(--bevel-out),3px 4px 8px rgba(0,0,0,.3);animation:ddin .12s ease-out}
.ddi{display:flex;align-items:center;gap:6px;padding:3px 22px 3px 4px;border:0;background:transparent;text-align:left;white-space:nowrap}
.ddi .chk{width:12px;flex:none;text-align:center}
.ddi:hover:not(:disabled),.ddi:focus-visible{background:var(--navy);color:#fff;outline:0}
.ddi:disabled{color:var(--shade);text-shadow:1px 1px #fff}
.ddsep{height:2px;margin:3px 1px;box-shadow:inset 0 1px #808080,inset 0 -1px #fff}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.statusbar{display:flex;flex:none;gap:2px;margin-top:3px}
.pane{flex:1;padding:2px 6px;box-shadow:var(--bevel-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane.sm{flex:none}

/* Tabs */
.tabs{display:flex;flex:none;position:relative;z-index:1;margin:0 0 -2px;padding:0 2px}
.tab{margin-top:2px;padding:3px 10px;border:0;background:var(--face);box-shadow:inset 1px 1px #fff,inset -1px 0 #000,inset -2px 0 #808080,inset 2px 2px #dfdfdf}
.tab.sel{position:relative;margin:0 -2px;padding:5px 12px 5px;z-index:2}
.tabpanel{flex:1;min-height:0;overflow:auto;padding:2px;box-shadow:var(--bevel-out)}

/* ===== sobre_mi.txt: contenido Frutiger Aero ===== */
.aero{flex:1;min-height:0;overflow:auto;box-shadow:var(--bevel-field);background:#bfe7ff;-webkit-user-select:text;user-select:text;font:13px/1.45 var(--aero);color:#0b3550;outline:0}
.aero:focus-visible{outline:2px dotted #0a79c0;outline-offset:-3px}
.aero ::selection{background:#1b8fd8;color:#fff}
.aero-in{position:relative;overflow:hidden;min-height:100%;box-sizing:border-box;padding:18px 18px 24px;background:linear-gradient(180deg,#5db6f5 0,#a7dcff 20%,#e4f6ff 48%,#f2fcff 70%,#bfeaa8 100%)}
.aero-in>*{position:relative;z-index:1}
.aero-in>.bub{position:absolute;z-index:0}
.bub{border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 22%,rgba(150,215,255,.12) 55%,rgba(255,255,255,.5) 64%,rgba(255,255,255,.1) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 2px 6px rgba(0,90,150,.15);animation:float 7s ease-in-out infinite}
.bub:nth-of-type(2n){animation-duration:9s;animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.45));border:1px solid #fff;box-shadow:0 6px 18px rgba(10,90,150,.3),inset 0 1px 0 #fff}
.ph-wrap{position:relative;flex:none;width:100px;height:100px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 2px #4fb2f0,0 6px 14px rgba(0,70,130,.4)}
.ph-wrap img{display:block;width:100%;height:100%;object-fit:cover}
.ph-wrap::after{content:"";position:absolute;left:10%;right:10%;top:3%;height:44%;border-radius:50% 50% 60% 60%/75% 75% 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
.hero-tx{min-width:0;flex:1 1 200px}
.hero h1{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.05;font-weight:800;letter-spacing:-.3px;color:#0a5a8c;text-shadow:0 1px 0 #fff,0 0 12px rgba(255,255,255,.9)}
.hero .role{margin:5px 0 0;font-weight:700;color:#1f6f9c}
.call{display:inline-block;margin:8px 6px 0 0;padding:3px 12px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.3px;color:#fff;background:linear-gradient(180deg,#b9f27d 0,#5cc934 48%,#3fae22 52%,#7be04c 100%);border:1px solid #3a9c24;text-shadow:0 1px 1px rgba(0,80,0,.55);box-shadow:0 2px 5px rgba(0,80,20,.35),inset 0 1px 0 rgba(255,255,255,.8)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid>*{min-width:0}
.span{grid-column:1/-1}
.card{padding:12px 14px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.5));border:1px solid #fff;box-shadow:0 4px 14px rgba(20,100,160,.25),inset 0 1px 0 #fff;backdrop-filter:blur(5px)}
.card p{margin:0}
.pill{position:relative;display:inline-block;margin:0 0 10px;padding:3px 16px 4px;border-radius:999px;font-weight:800;font-size:13px;line-height:1.25;color:#fff;letter-spacing:.3px;background:linear-gradient(180deg,#8fe3ff 0,#2fb0ee 48%,#0b8ad8 52%,#3cc6f2 100%);border:1px solid #0a79c0;text-shadow:0 1px 2px rgba(0,50,100,.6);box-shadow:0 2px 5px rgba(0,80,140,.35),inset 0 1px 0 rgba(255,255,255,.8)}
.pill.g{background:linear-gradient(180deg,#b9f27d 0,#5cc934 48%,#3fae22 52%,#7be04c 100%);border-color:#3a9c24;text-shadow:0 1px 2px rgba(0,70,0,.55);box-shadow:0 2px 5px rgba(0,80,20,.35),inset 0 1px 0 rgba(255,255,255,.8)}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.kv b{color:#0a79c0;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.kv span{min-width:0;margin-bottom:8px;font-weight:600;overflow-wrap:anywhere}
.job{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-top:1px solid rgba(60,150,210,.28)}
.job:first-of-type{border-top:0;padding-top:0}
.job b{font-size:14px;color:#0a4f7a}
.job .yr{font-weight:800;color:#0a79c0;font-variant-numeric:tabular-nums}
.job .meta{grid-column:1/-1;font-size:11.5px;font-weight:700;color:#2f7ba8}
.job p{grid-column:1/-1;margin-top:2px;font-size:12.5px}
.item{padding:6px 0;border-top:1px solid rgba(60,150,210,.28)}
.item:first-of-type{border-top:0;padding-top:0}
.item b{display:block;color:#0a4f7a}
.item small{font-size:11.5px;font-weight:700;color:#2f7ba8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 11px 3px;border-radius:999px;background:linear-gradient(180deg,#fff,#d4eeff);border:1px solid #8cc9ee;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,80,140,.2);font-weight:700;font-size:12px;color:#0b5a88}
.chip.g{background:linear-gradient(180deg,#f6ffe9,#cdf2a8);border-color:#9bd26f;color:#2c6a12}
.aero ul{margin:0;padding:0;list-style:none}
.aero li{position:relative;padding:3px 0 3px 18px}
.aero li::before{content:"";position:absolute;left:2px;top:.7em;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#7be04c 40%,#2f9e1c 100%);box-shadow:0 1px 2px rgba(0,80,20,.4)}

/* Propiedades de pantalla */
.pw{display:flex;flex-direction:column;gap:10px;padding:14px 12px 12px}
.mon{position:relative;width:176px;margin:0 auto 12px;padding:14px 14px 18px;background:var(--face);box-shadow:var(--bevel-out)}
.mon::after{content:"";position:absolute;left:50%;bottom:-8px;width:60px;height:8px;margin-left:-30px;background:var(--face);box-shadow:var(--bevel-out)}
.scr{position:relative;height:96px;overflow:hidden;background-color:var(--pv,#008080);background-size:cover;background-position:center bottom;box-shadow:var(--bevel-field)}
.scr .m1,.scr .m2{position:absolute;left:6px;width:8px;height:8px;background:var(--face);box-shadow:var(--bevel-soft)}
.scr .m1{top:6px}
.scr .m2{top:22px;background:#ffff7a}
.scr .mwin{position:absolute;left:34px;top:14px;width:70px;height:44px;background:var(--face);box-shadow:var(--bevel-out)}
.scr .mwin i{display:block;height:7px;margin:2px;background:linear-gradient(90deg,var(--navy),var(--sky))}
.scr .mtask{position:absolute;left:0;right:0;bottom:0;height:9px;background:var(--face);box-shadow:inset 0 1px #fff}
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wpt{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;padding:3px;border:0;background:var(--face);box-shadow:var(--bevel-out);text-align:center}
.wpt i{display:block;height:48px;background-size:cover;background-position:center bottom;box-shadow:var(--bevel-field)}
.wpt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wpt[aria-pressed="true"]{box-shadow:var(--bevel-press);background:var(--dither) 0 0/2px 2px}
.wpt[aria-pressed="true"] span{font-weight:bold}
.sw-grid{display:grid;grid-template-columns:repeat(8,24px);gap:4px;justify-content:start}
.sw{width:24px;height:24px;padding:0;border:0;background:var(--c);box-shadow:var(--bevel-soft)}
.sw[aria-pressed="true"]{outline:2px solid var(--navy);outline-offset:1px}
.sw:focus-visible{outline:1px dotted #000;outline-offset:2px}
.pw-row{display:flex;align-items:center;gap:10px}
.picker{position:relative;min-width:0}
.picker input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0}
.hex{padding:3px 8px;background:#fff;box-shadow:var(--bevel-field);font:18px/1 var(--px);min-width:70px}

/* Diálogo de apagado */
.scrim{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.scrim:not([hidden]){animation:fadein .15s ease-out}
.scrim .win{position:relative;width:min(340px,calc(100% - 16px));animation:winin .2s cubic-bezier(.2,.9,.3,1.2)}
.dlg-body{padding:14px 12px 8px}
.sd-row{display:flex;gap:14px;align-items:flex-start}
.sd-row p{margin:0 0 6px}
.rad{position:relative;display:flex;align-items:center;gap:7px;margin:7px 0}
.rad input{position:absolute;opacity:0}
.rad i{display:grid;place-items:center;flex:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff,inset 2px 2px #000,inset -2px -2px #dfdfdf}
.rad input:checked+i::after{content:"";width:4px;height:4px;border-radius:50%;background:#000}
.rad input:focus-visible~span{outline:1px dotted #000;outline-offset:1px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes winin{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}

/* Barra de tareas */
#taskbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:3px;box-sizing:border-box;height:var(--task-h);padding:3px max(2px,env(safe-area-inset-right,0px)) 2px max(2px,env(safe-area-inset-left,0px));background:var(--face);box-shadow:inset 0 1px 0 var(--face-lt),inset 0 2px 0 #fff}
.sbtn{display:flex;align-items:center;gap:5px;flex:none;height:24px;padding:0 8px 0 5px;border:0;background:var(--face);box-shadow:var(--bevel-out);font-weight:bold;font-size:13px}
.sbtn.open{box-shadow:var(--bevel-press);padding:1px 7px 0 6px}
#tasks{display:flex;flex:1;min-width:0;gap:3px}
.task{display:flex;align-items:center;gap:5px;flex:0 1 160px;min-width:28px;height:24px;padding:0 6px;border:0;background:var(--face);box-shadow:var(--bevel-out);text-align:left;animation:taskin .2s ease-out}
.task span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.task.on{background:var(--dither) 0 0/2px 2px;box-shadow:var(--bevel-press);font-weight:bold}
@keyframes taskin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#tray{display:flex;align-items:center;gap:2px;flex:none;height:22px;padding:0 8px 0 2px;box-shadow:var(--bevel-soft)}
.tray-btn{display:flex;align-items:center;justify-content:center;gap:3px;height:18px;min-width:20px;padding:0 3px;border:0;background:transparent;font-size:11px;font-weight:bold}
.tray-btn:hover{box-shadow:var(--bevel-flat)}
.tray-btn:active,.tray-btn.open{box-shadow:var(--bevel-press)}
#clock{padding-left:5px}

/* Menú */
#startmenu{position:absolute;left:max(2px,env(safe-area-inset-left,0px));bottom:calc(var(--task-h) - 2px);z-index:25;display:flex;min-width:200px;padding:3px;background:var(--face);box-shadow:var(--bevel-out),3px -2px 10px rgba(0,0,0,.3);transform-origin:0 100%;animation:smenu .16s cubic-bezier(.2,.9,.3,1)}
@keyframes smenu{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.stripe{display:flex;align-items:flex-end;flex:none;width:28px;padding:6px 0;background:linear-gradient(0deg,var(--navy),var(--sky))}
.stripe span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font:18px/1 var(--ui);letter-spacing:.5px;white-space:nowrap}
.stripe b{font-weight:bold;font-size:20px}
.slist{display:flex;flex:1;flex-direction:column;padding:2px 0}
.sitem{display:flex;align-items:center;gap:10px;height:40px;padding:0 26px 0 8px;border:0;background:transparent;font-size:14px;text-align:left}
.sitem:hover,.sitem:focus-visible{background:var(--navy);color:#fff;outline:0}
.ssep{height:2px;margin:3px 2px;box-shadow:inset 0 1px #808080,inset 0 -1px #fff}

/* Pantalla de apagado */
#shutdown{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px;text-align:center}
#shutdown.ph1{background:conic-gradient(#000 25%,var(--desk) 0 50%,#000 0 75%,var(--desk) 0) 0 0/2px 2px}
#shutdown.ph2,#shutdown.ph3{background:#000}
.sd-msg{font:40px/1.1 var(--px);color:#fff;text-shadow:2px 2px #000}

/* ---------- Cursores y barras de desplazamiento pixeladas ---------- */
function PX(rows,map,scale){
  var r='';

    var x=0;
    while(x<row.length){
      var c=row[x];
      if(c==='.'){x++;continue;}
      var x2=x;
      while(x2<row.length&&row[x2]===c)x2++;
      r+='<rect x="'+x+'" y="'+y+'" width="'+(x2-x)+'" height="1" fill="'+map[c]+'"/>';
      x=x2;

(function(){
  if(RM)return;
  var cx=0,cy=0,cs=1,gx=0,gy=0,gs=1,run=false;
  function frame(){
    cx+=(gx-cx)*.09;cy+=(gy-cy)*.09;cs+=(gs-cs)*.09;
    os.style.transform='translate3d('+cx.toFixed(2)+'px,'+cy.toFixed(2)+'px,0) scale('+cs.toFixed(4)+')';
    if(Math.abs(gx-cx)>.05||Math.abs(gy-cy)>.05||Math.abs(gs-cs)>.0002)requestAnimationFrame(frame);
    else run=false;
  }
  document.addEventListener('pointermove',function(e){
    if(e.pointerType!=='mouse')return;
    var W=window.innerWidth,H=window.innerHeight;
    var nx=Math.max(-1,Math.min(1,e.clientX/W*2-1)),ny=Math.max(-1,Math.min(1,e.clientY/H*2-1));
    gx=-nx*.01*W;gy=-ny*.01*H;gs=1+.02*Math.max(Math.abs(nx),Math.abs(ny));
    if(!run){run=true;requestAnimationFrame(frame);}
  });
  document.documentElement.addEventListener('mouseleave',function(){gx=0;gy=0;gs=1;if(!run){run=true;requestAnimationFrame(frame);}});
})();

function openPopup(anchor,items,up){
  closePopup();

    var b=mk('button','ddi');

    b.lastChild.textContent=it.label;
    b.addEventListener('click',function(){closePopup();if(it.run)it.run();});
    dd.appendChild(b);
  });
  os.appendChild(dd);
  var r=anchor.getBoundingClientRect(),o=os.getBoundingClientRect();
  var s=(o.width/os.offsetWidth)||1;
  var left=(r.left-o.left)/s;
  left=Math.max(2,Math.min(left,os.offsetWidth-dd.offsetWidth-2));
  dd.style.left=left+'px';
  if(up)dd.style.bottom=((o.bottom-r.top)/s)+'px';
  else dd.style.top=((r.bottom-o.top)/s)+'px';
  anchor.classList.add('open');
  popup={dd:dd,anchor:anchor};
  sfx('menu');

      if(it[1]==='wrap')o.checked=true;
      if(it[1]==='status'){o.checked=status;o.run=function(){status=!status;sb.hidden=!status;};}
      if(it[1]==='exit')o.run=function(){closeWin(w);};
      if(it[1]==='copy')o.run=function(){try{document.execCommand('copy');}catch(_){}};
      if(it[1]==='all')o.run=function(){var r=document.createRange();r.selectNodeContents($('.aero-in',doc));var s=window.getSelection();s.removeAllRanges();s.addRange(r);};
      return o;
    });
  }
  $$('.mi',c).forEach(function(b,i){
    b.addEventListener('click',function(){
      if(popup&&popup.anchor===b){closePopup();return;}
      openPopup(b,items(i));
    });
    b.addEventListener('mouseenter',function(){if(popup&&popup.anchor!==b)openPopup(b,items(i));});
  });
}

/* ---------- Propiedades de pantalla ---------- */
var PAL=['#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080','#c0c0c0','#ffffff','#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff'];
function buildDisplay(w,c){
  var pend=JSON.parse(JSON.stringify(bg));
  c.innerHTML='<div class="tabs"><span class="tab sel"'+ia('dsk.tab')+'>'+t('dsk.tab')+'</span></div>'
   +'<div class="tabpanel"><div class="pw">'
   +'<div class="mon" aria-hidden="true"><div class="scr"><span class="m1"></span><span class="m2"></span><span class="mwin"><i></i></span><span class="mtask"></span></div></div>'
   +'<div'+ia('dsk.wp')+'>'+t('dsk.wp')+'</div><div class="wp-grid"></div>'
   +'<div'+ia('dsk.solid')+'>'+t('dsk.solid')+'</div><div class="sw-grid" role="group"></div>'
   +'<div class="pw-row"><label class="btn picker"><span'+ia('dsk.custom')+'>'+t('dsk.custom')+'</span><input type="color" aria-label="color"></label><span class="hex" aria-live="polite"></span></div>'
   +'</div></div>'
   +'<div class="btnrow"><button class="btn def" type="button" data-b="ok"'+ia('btn.ok')+'>'+t('btn.ok')+'</button><button class="btn" type="button" data-b="cancel"'+ia('btn.cancel')+'>'+t('btn.cancel')+'</button><button class="btn" type="button" data-b="apply"'+ia('btn.apply')+'>'+t('btn.apply')+'</button></div>';
  var scr=$('.scr',c),hex=$('.hex',c),pick=$('input[type=color]',c);
  var wpg=$('.wp-grid',c),swg=$('.sw-grid',c);
  var wpb=WPIDS.map(function(id){
    var b=mk('button','wpt','<i></i><span'+ia(WP[id].n)+'>'+t(WP[id].n)+'</span>');
    b.type='button';
    $('i',b).style.backgroundImage=wpURL(id);
    b.addEventListener('click',function(){set({t:'wp',id:id});});
    wpg.appendChild(b);
    return {b:b,id:id};
  });
  var swb=PAL.map(function(col){
    var b=mk('button','sw');
    b.type='button';b.title=col;b.setAttribute('aria-label',col);
    b.style.setProperty('--c',col);
    b.addEventListener('click',function(){set({t:'solid',c:col});});
    swg.appendChild(b);
    return {b:b,c:col};
  });
  function set(v){
    pend=v;
    if(v.t==='wp'){
      scr.style.backgroundImage=wpURL(v.id);
      hex.textContent=t(WP[v.id].n);
    }else{
      scr.style.backgroundImage='none';
      scr.style.setProperty('--pv',v.c);
      hex.textContent=v.c.toUpperCase();
      pick.value=v.c;
    }
    wpb.forEach(function(x){x.b.setAttribute('aria-pressed',String(v.t==='wp'&&v.id===x.id));});
    swb.forEach(function(x){x.b.setAttribute('aria-pressed',String(v.t==='solid'&&v.c===x.c));});
  }
  pick.addEventListener('input',function(){set({t:'solid',c:pick.value.toLowerCase()});});
  function apply(){
    bg=JSON.parse(JSON.stringify(pend));
    applyBg(bg);
    lsSet('escritorio98-fondo-v2',JSON.stringify(bg));
  }
  c.addEventListener('click',function(e){
    var b=e.target.closest('[data-b]');
    if(!b)return;
    if(b.dataset.b==='apply')apply();
    else if(b.dataset.b==='ok'){apply();closeWin(w);}
    else closeWin(w);
  });
  w.refreshHex=function(){if(pend.t==='wp')hex.textContent=t(WP[pend.id].n);};
  set(pend);
}

/*@@APPS@@*/
var APPS={
  notepad:{title:'np.title',icon:'i-notepad',w:620,h:540,build:buildNotepad},
  display:{title:'dsk.title',icon:'i-display',w:370,h:560,build:buildDisplay,scroll:true,canMin:false,canMax:false,onLang:function(w){if(w.refreshHex)w.refreshHex();}}
  /*@@REG@@*/
};

/* ---------- Íconos del escritorio ---------- */
var ICONS=[
  {app:'notepad',sym:'i-note',raw:'sobre_mi.txt',aria:'ic.note.a'}
  /*@@ICONS@@*/
];
var iconsEl=$('#icons');
ICONS.forEach(function(d,i){
  var el=mk('div','dicon','<span class="glyph">'+ico(d.sym,32)+'</span><span class="lbl"></span>');
  el.tabIndex=0;el.setAttribute('role','button');
  el.dataset.open=d.app;el.style.setProperty('--i',i);
  var l=$('.lbl',el);
  if(d.raw)l.textContent=d.raw;else{l.setAttribute('data-i18n',d.key);l.textContent=t(d.key);}
  el.setAttribute('data-ia',d.aria||'');
  iconsEl.appendChild(el);
});
var icons=$$('.dicon');
function select(ic){icons.forEach(function(x){x.classList.toggle('sel',x===ic);});}
var last={el:null,t:0};
icons.forEach(function(ic){
  ic.addEventListener('pointerdown',function(){select(ic);});
  ic.addEventListener('click',function(){
    var n=performance.now();
    if(last.el===ic&&n-last.t<500){last={el:null,t:0};openApp(ic.dataset.open);}
    else last={el:ic,t:n};
  });
  ic.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();select(ic);openApp(ic.dataset.open);}
  });
});

/* ---------- Menú y barra de tareas ---------- */
var sbtn=$('#sbtn'),smenu=$('#startmenu');
function toggleStart(open){
  var o=(open===undefined)?smenu.hidden:open;
  smenu.hidden=!o;
  sbtn.classList.toggle('open',o);
  sbtn.setAttribute('aria-expanded',String(o));
  if(o)sfx('menu');
}
sbtn.addEventListener('click',function(){toggleStart();});
smenu.addEventListener('click',function(e){
  var b=e.target.closest('.sitem');
  if(!b)return;
  runCmd(b.dataset.cmd);
});
function runCmd(cmd){
  toggleStart(false);
  if(cmd==='display')openApp('display');else openShutdown();
}
document.addEventListener('pointerdown',function(e){
  if(!e.target.closest('.dicon'))select(null);
  if(!smenu.hidden&&!e.target.closest('#startmenu,#sbtn'))toggleStart(false);
  if(popup&&!e.target.closest('.dd,.mi,#langbtn'))closePopup();
},true);
document.addEventListener('click',function(e){
  if(e.target.closest('.btn,.sbtn,.task,.sitem,.ddi,.mi,.tab,.sw,.wpt,.tray-btn'))sfx('click');
},true);

/* Bandeja: idioma, volumen y reloj */
var clk=$('#clock'),tray=$('#tray'),langBtn=$('#langbtn'),volBtn=$('#volbtn');
function setVol(v){
  vol=v;
  lsSet('escritorio98-sonido',v?'1':'0');
  $('#voluse').setAttribute('href',v?'#i-speaker':'#i-speaker-off');
  volBtn.setAttribute('aria-pressed',String(v));
  var s=t(v?'tray.von':'tray.voff');
  volBtn.title=s;volBtn.setAttribute('aria-label',s);
}
volBtn.addEventListener('click',function(){
  if(vol){sfx('click');setVol(false);}
  else{setVol(true);sfx('chime');}
});
langBtn.addEventListener('click',function(){
  if(popup&&popup.anchor===langBtn){closePopup();return;}
  openPopup(langBtn,LANGS.map(function(l,i){return {label:l[1],checked:i===LI,run:function(){setLang(i);}};}),true);
});
function tickTray(){
  var d=new Date();
  clk.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  try{
    var s=d.toLocaleDateString(LANGS[LI][0],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    tray.title=s.charAt(0).toUpperCase()+s.slice(1);
  }catch(_){}
}
setInterval(function(){tickTray();wins.forEach(function(w){if(w.cfg.onTick)w.cfg.onTick(w);});},1000);

function applyLang(quiet){
  root.lang=LANGS[LI][0];
  $$('[data-i18n]').forEach(function(n){n.textContent=t(n.getAttribute('data-i18n'));});
  $$('[data-i18n-a]').forEach(function(n){
    n.getAttribute('data-i18n-a').split(',').forEach(function(p){var kv=p.split(':');n.setAttribute(kv[0],t(kv[1]));});
  });
  $$('.dicon').forEach(function(ic){
    var l=$('.lbl',ic),a=ic.getAttribute('data-ia');
    ic.setAttribute('aria-label',l.textContent+(a?', '+t(a):''));
  });
  $('#langcode').textContent=LANGS[LI][2];
  langBtn.title=t('tray.lang');langBtn.setAttribute('aria-label',t('tray.lang')+': '+LANGS[LI][1]);
  setVol(vol);
  tickTray();
  if(!quiet){
    wins.forEach(function(w){w.setTitle();if(w.cfg.onLang)w.cfg.onLang(w);});
  }
}
function setLang(i){
  LI=i;lsSet('escritorio98-idioma',LANGS[i][0]);
  closePopup();
  applyLang(false);
}

/* ---------- Apagar y reiniciar ---------- */
var modal=$('#modal'),sd=$('#shutdown'),sdMsg=$('.sd-msg',sd),sdHint=$('.sd-hint',sd),sdOff=false,sdTimer=0;
function setInert(v){desk.inert=v;taskbar.inert=v;}
function openShutdown(){
  modal.hidden=false;setInert(true);sfx('open');
  $('[data-sd="yes"]',modal).focus();
}
function closeModal(){modal.hidden=true;setInert(false);sbtn.focus();}
function boot(){
  sdOff=false;sd.className='ph3';sdMsg.textContent='';sdHint.textContent='';
  clearTimeout(sdTimer);
  sfx('chime');
  sdTimer=setTimeout(function(){sd.hidden=true;setInert(false);},900);
}
function power(mode){
  modal.hidden=true;
  Array.from(wins.values()).forEach(function(w){closeWin(w);});
  sd.hidden=false;setInert(true);
  sd.className='ph1';
  sdMsg.textContent=t(mode==='restart'?'sd.restarting':'sd.offing');
  sdHint.textContent='';
  clearTimeout(sdTimer);
  sdTimer=setTimeout(function(){
    if(mode==='restart'){boot();return;}
    sd.className='ph2';
    sdMsg.textContent=t('sd.safe');
    sdHint.textContent=t('sd.hint');
    sdOff=true;
    try{window.close();}catch(_){}
  },2200);
}
modal.addEventListener('click',function(e){
  var b=e.target.closest('[data-sd]');
  if(!b)return;
  if(b.dataset.sd==='yes'){
    var r=$('input[name="sd"]:checked',modal);
    power(r?r.value:'off');
  }else closeModal();
});
sd.addEventListener('pointerdown',function(){if(sdOff)boot();});

/* ---------- Teclado ---------- */
document.addEventListener('keydown',function(e){
  if(sdOff){e.preventDefault();boot();return;}
  if(!sd.hidden)return;
  if(e.key==='Escape'){
    if(popup){closePopup();return;}
    if(!smenu.hidden){toggleStart(false);sbtn.focus();return;}
    if(!modal.hidden){closeModal();return;}
  }
  if(!modal.hidden)return;
  if(!smenu.hidden){
    var k=e.key.toLowerCase();
    if(k==='arrowdown'||k==='arrowup'){
      var its=$$('.sitem',smenu),i=its.indexOf(document.activeElement);
      i=(k==='arrowdown')?(i+1)%its.length:((i<=0?its.length:i)-1);
      its[i].focus();e.preventDefault();
    }
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(active&&active.cfg.onKey&&!e.target.closest('input,textarea')&&active.cfg.onKey(active,e))e.preventDefault();
});

applyLang(true);
})();
</script>
